# Optional: edit host, TLS Secret, and IngressClass before applying separately.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
spec:
  ingressClassName: kommander-traefik
  tls:
    - hosts:
        - openwebui.example.com
      secretName: open-webui-tls
  rules:
    - host: openwebui.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 80
